<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#003f43">
  <title>لعبة بطاقات الذاكرة</title>
  <style>
    @font-face {
      font-family: "Saudi";
      src: url("font/Saudi-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Saudi";
      src: url("font/Saudi-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #003f43;
      --white: #fff;
      --lime: #7fc241;
      --line: #159b69;
      --purple: #7770c8;
      --green: #72bd39;
      --coral: #df654e;
      --magenta: #a91653;
      --cyan: #12a7ad;
      --gold: #9b7b2d;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg)
    }

    body {
      font-family: "Saudi", Tahoma, Arial, sans-serif;
      color: var(--white);
      display: flex;
      justify-content: center
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent
    }

    .app {
      width: min(100%, 430px);
      min-height: 100svh;
      padding: 22px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden
    }

    .top {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
      direction: ltr
    }

    .logo {
      display: block;
      object-fit: contain
    }

    .logo.moe {
      width: 116px;
      height: 88px;
      object-position: left center
    }

    .logo.national {
      width: 150px;
      height: 92px;
      object-position: right center
    }

    .department {
      font-size: 24px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
      margin: -8px 0 8px;
      color: #fff;
    }

    .title {
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
      margin: 0 0 14px;
      text-align: center;
      letter-spacing: 0
    }

    .stats {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
      direction: rtl;
      width: 100%;
    }

    .pill {
      width: 115px;
      min-width: 115px;
      height: 32px;
      padding: 0 8px;
      border-radius: 50px;
      background: rgba(127, 194, 65, .96);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      font-size: 21px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .10);
    }

    .pill strong {
      font-weight: 700
    }

    .board {
      width: 100%;
      max-width: 374px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 24px;
      direction: ltr
    }

    .card {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      aspect-ratio: 1/1;
      position: relative;
      perspective: 900px;
      cursor: pointer;
      border-radius: 2px;
    }

    .card:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px
    }

    .card:active {
      transform: scale(.975)
    }

    .inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .52s cubic-bezier(.2, .75, .2, 1)
    }

    .card.flipped .inner,
    .card.matched .inner {
      transform: rotateY(180deg)
    }

    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      backface-visibility: hidden;
      border: 2px solid #149a67;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back {
      background: #064e4d
    }

    .back img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover
    }

    .front {
      transform: rotateY(180deg);
      padding: 8px;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .front:before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px solid rgba(0, 0, 0, .28);
      background: repeating-linear-gradient(45deg, transparent 0 9px, rgba(0, 0, 0, .12) 9px 12px);
      opacity: .45
    }

    .front .label {
      position: relative;
      z-index: 2;
      color: #fff;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
      padding: 5px;
      max-width: 100%;
      overflow-wrap: anywhere
    }

    .front.definition .label {
      font-size: 9px;
      line-height: 1.3;
      font-weight: 600;
      padding: 4px
    }

    .front.term .label {
      font-size: 16px;
      line-height: 1.35
    }

    .p1 .front {
      background: var(--purple)
    }

    .p2 .front {
      background: var(--green)
    }

    .p3 .front {
      background: var(--coral)
    }

    .p4 .front {
      background: var(--magenta)
    }

    .p5 .front {
      background: var(--cyan)
    }

    .p6 .front {
      background: var(--gold)
    }

    .matched .front {
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .55)
    }

    .bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      width: 100%;
    }

    .reset {
      border: 0;
      border-radius: 16px;
      background: var(--lime);
      color: #fff;
      
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      
        padding: 4px 32px;
        min-height: 26px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
    }

    .reset:active {
      transform: scale(.97)
    }

    .instruction {
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
      margin: 20px 0 0;
      color: #fff;
      font-weight: 500
    }

    .message {
      font-size: 15px;
      min-height: 22px;
      margin-top: 10px;
      text-align: center;
      color: #d9f1e6
    }

    @media(max-width:380px) {
      .app {
        padding-left: 11px;
        padding-right: 11px
      }

      .logo.moe {
        width: 102px
      }

      .logo.national {
        width: 135px
      }

      .department {
        font-size: 16px;
        line-height: 1.4;
        font-weight: 700;
        text-align: center;
        margin: -8px 0 8px;
        color: #fff;
      }

      .title {
        font-size: 27px;
        margin-bottom: 12px
      }

      .stats {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin-bottom: 20px;
        direction: rtl;
      }

      .pill {
        width: 115px;
        min-width: 115px;
        height: 32px;
        padding: 0 8px;
        border-radius: 50px;
        background: var(--lime);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: #fff;
        font-size: 21px;
        font-weight: 700;
        white-space: nowrap;
      }

      .board {
        gap: 9px 14px
      }

      .front .label {
        font-size: 12px;
        padding: 3px
      }

      .front.definition .label {
        font-size: 8px;
        line-height: 1.25;
        padding: 3px
      }

      .front.term .label {
        font-size: 12px
      }

      .reset {
        border: 0;
        border-radius: 22px;
        background: var(--lime);
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 32px;
        min-height: 26px;
      }

      .instruction {
        font-size: 15px;
        margin-top: 15px
      }
    }

    @media(min-width:600px) {
      body {
        padding: 20px
      }

      .app {
        min-height: auto;
        border-radius: 24px;
        box-shadow: 0 20px 70px rgba(0, 0, 0, .25)
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .inner {
        transition: none
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="top" aria-label="الشعارات">
      <img class="logo moe" src="assets/moe.png" alt="وزارة التعليم">
      <img class="logo national" src="assets/national-day.png" alt="اليوم الوطني السعودي">
    </header>

    <div class="department">إدارة تنمية القدرات بجدة- قسم الموهوبين</div>
    <h1 class="title">لعبة بطاقات الذاكرة</h1>

    <div class="stats" aria-label="إحصائيات اللعبة">
      <div class="pill">الحركات: <strong id="moves">0</strong></div>
      <div class="pill">الأزواج: <strong id="pairs">0/6</strong></div>
    </div>

    <section class="board" id="board" aria-label="بطاقات الذاكرة"></section>

    <div class="bottom">
      <button class="reset" id="reset" type="button">إعادة اللعب</button>
      <div class="instruction">اضغط على البطاقة لقلبها • إذا تطابق الكرتان يثبتان</div>
      <div class="message" id="message" aria-live="polite">اختر كرتين متشابهين</div>
    </div>
  </main>
  <script>
    const pairs = [
      { pair: 1, term: 'مراكز الموهوبين', definition: 'مؤسسة تربوية تعليمية تعنى بتقديم الخدمات المتخصصة للطلبة الموهوبين', color: 'p1' },
      { pair: 2, term: 'برنامج الكشف عن الموهوبين', definition: 'برنامج وطني بهدف إلى الكشف عن الموهبة وصقلها عبر برامج الرعاية المناسبة', color: 'p2' },
      { pair: 3, term: 'مدارس الموهوبين التقنية', definition: 'بناء قدرات الموهوبين ورعايتهم في مجالات التقنيات الحديثة', color: 'p3' },
      { pair: 4, term: 'مدارس الموهوبين الثقافية', definition: ' تجمع بين التعليم الأكاديمي والتعليم الثقافي بالشراكة بين وزارة التعليم ووزارة الثقافة', color: 'p4' },
      { pair: 5, term: 'مدارس الموهوبين للرياضيات', definition: 'مدارس حكومية متخصصة لرعاية الطلبة الموهوبين في الرياضيات وإعدادهم للمنافسات والأولمبيات العالمية', color: 'p5' },
      { pair: 6, term: 'مدارس الموهوبين العلمية', definition: 'مدرسة حكومية متخصصة لرعاية الموهوبين تنمي الابداع والابتكار والبحث للمنافسة محليا وعالميا', color: 'p6' }
    ];


    const cards = pairs.flatMap(item => [
      { id: `${item.pair}-term`, pair: item.pair, kind: 'term', text: item.term, image: `assets/back${item.pair * 2 - 1}.png` },
      { id: `${item.pair}-definition`, pair: item.pair, kind: 'definition', text: item.definition, image: `assets/back${item.pair * 2}.png` }
    ]);

    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const message = document.getElementById('message');
    const reset = document.getElementById('reset');
    let first = null, locked = false, moves = 0, matched = 0;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function cardTemplate(card, index) {
      const typeLabel = card.kind === 'term' ? 'المصطلح' : 'التعريف';
      return `<button class="card p${card.pair}" type="button" data-value="${card.pair}" aria-label="بطاقة ${index + 1}: ${typeLabel}">
    <span class="inner">
      <span class="face back" aria-hidden="true"><img src="${card.image}" alt=""></span>
      <span class="face front ${card.kind}"><span class="label">${card.text}</span></span>
    </span>
  </button>`;
    }

    function update() {
      movesEl.textContent = moves;
      pairsEl.textContent = `${matched}/6`;
    }

    function newGame() {
      const deck = shuffle(cards.map(card => ({ ...card })));
      board.innerHTML = deck.map(cardTemplate).join('');
      [...board.children].forEach(card => card.addEventListener('click', () => flip(card)));
      first = null; locked = false; moves = 0; matched = 0; update();
      message.textContent = 'طابق المصطلح مع تعريفه';
    }

    function flip(card) {
      if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      if (!first) { first = card; return; }

      const second = card;
      moves++; update();

      if (first.dataset.value === second.dataset.value) {
        first.classList.add('matched');
        second.classList.add('matched');
        matched++;
        first = null;
        update();
        if (matched === 6) {
          message.textContent = `أحسنت! أكملت اللعبة في ${moves} حركة.`;
        } else {
          message.textContent = 'ممتاز! زوج متطابق.';
        }
        return;
      }

      locked = true;
      message.textContent = 'حاول مرة أخرى';
      const a = first, b = second;
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        first = null;
        locked = false;
        message.textContent = 'طابق المصطلح مع تعريفه';
      }, 850);
    }

    reset.addEventListener('click', newGame);
    newGame();
  </script>
</body>

</html>
